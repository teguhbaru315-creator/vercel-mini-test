<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vercel Mini Pribadi - Nawasolusi</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0a0a0a; color: #ededed; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .card { background: #141414; border: 1px solid #2a2a2a; border-radius: 16px; padding: 40px; max-width: 500px; text-align: center; box-shadow: 0 8px 30px rgba(0,0,0,0.5); }
        .badge { background: #0070f3; color: white; padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
        h1 { margin-top: 20px; font-size: 26px; }
        p { color: #888; font-size: 15px; line-height: 1.6; }
        .version { background: #222; border-radius: 8px; padding: 12px; font-family: monospace; font-size: 14px; color: #00dfa2; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="card">
        <span class="badge">Live Deployment</span>
        <h1>🚀 Vercel Pribadi Berhasil!</h1>
        <p>Project ini di-deploy otomatis ke VPS Herza menggunakan Webhook & Docker ala Vercel.</p>
        <div class="version">Status: Versi 1.0 (Initial Build)</div>
    </div>
</body>
</html>
